<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>計算レールRPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12141c;color:#eee;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:manipulation}
body{position:relative}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
#hud{display:flex;justify-content:space-around;padding:7px 10px;font-size:15px;background:#1c2030;font-weight:700}
canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none}
#log{min-height:42px;padding:6px 10px;font-size:13px;background:#1c2030;color:#ffe9a8;line-height:1.35}
#ui{padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#232739;display:grid;gap:6px}
#rails{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:6px 2px;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.ghost{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-50%) scale(1.2);padding:8px 14px;border-radius:8px;font-size:22px;font-weight:800;color:#fff;border:3px solid #fff;box-shadow:0 8px 16px #0009;text-shadow:0 1px 2px #0008}
.row{display:flex;gap:6px}
button,select{flex:1;padding:10px 4px;border:0;border-radius:8px;font-size:14px;background:#3a4066;color:#fff;font-family:inherit}
button.t{flex:0 0 auto;user-select:none;-webkit-user-select:none;touch-action:pan-x;min-width:58px;padding:8px 10px;font-size:19px;font-weight:800;border:3px solid transparent;text-shadow:0 1px 2px #0008}
button.sel{border-color:#fff;transform:translateY(-2px)}
button.go{background:#2f8f5b;font-weight:700}
button:disabled{opacity:.4}
#ov{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;font-size:20px;padding:24px;line-height:1.5;white-space:pre-line}
#ov.show{display:flex}
#ovb{display:flex;gap:8px;width:100%;max-width:360px}
</style></head><body>
<div id="app">
 <div id="hud"></div>
 <canvas id="cv"></canvas>
 <div id="log"></div>
 <div id="ui">
  <div id="rails"></div>
  <div class="row"><button class="go" id="go">出発</button><button id="clr">リセット</button><select id="stg"></select></div>
 </div>
</div>
<div id="ov"><div id="ovt"></div><div id="ovb"></div></div>
<script>
"use strict";
/* ===== ルール =====
 レールは「＋ − × ÷」のどれか。勇者はスタートの数字から、敷いたレールを順に通って計算していく。
 ゴールに着いたときの数字がゴールの数字と一致すればクリア。÷は割り切れないと進めない。
 ステージは固定(同じ番号なら毎回同じ問題)。ランダム要素なし。 */
const OPS=['+','−','×','÷'], OPCOL={'+':['#6fcf6f','#2f7a2f'],'−':['#ff8a80','#a33a33'],'×':['#ffd45e','#a67c10'],'÷':['#7cc4ff','#2a6a9e']};
const SLOTS=k=>2+Math.ceil(k/2);            // 通るレール数 3〜7
const POOL=k=>SLOTS(k)+2+Math.ceil(k/2);    // 手持ちレール数(ステージが上がるほど増える)
const apply=(v,t)=>t.op==='+'?v+t.n:t.op==='−'?v-t.n:t.op==='×'?v*t.n:(v%t.n?null:v/t.n);

const cv=document.getElementById('cv'),cx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,S=null,sel=null,view={sc:1,ox:0,oy:0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rngOf(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

/* ===== ステージ生成(シード固定。正解の並びを作ってから、ダミーを混ぜる) ===== */
function step(v,rnd,op){
  if(op==='+')return{op,n:1+(rnd()*9|0)};
  if(op==='−'&&v>1)return{op,n:1+(rnd()*Math.min(9,v-1)|0)};
  if(op==='×'&&v*4<=99)return{op,n:2+(rnd()*3|0)};
  if(op==='÷'){const d=[2,3,4,5,6,7,8,9].filter(d=>v%d===0&&v/d>=1);if(d.length)return{op,n:d[rnd()*d.length|0]};}
  return null;
}
function gen(k){
  for(let seed=k*7919+13;;seed++){
    const rnd=rngOf(seed),L=SLOTS(k),s=2+(rnd()*8|0),sol=[];let v=s;
    for(let i=0;i<L;i++){let t=null;for(let tries=0;!t&&tries<9;tries++)t=step(v,rnd,OPS[rnd()*4|0]);t=t||step(v,rnd,'+');v=apply(v,t);sol.push(t);}
    if(v===s||v<1||sol.filter(t=>t.op==='×'||t.op==='÷').length<(k>=3?1:0))continue;
    const pool=sol.slice();
    while(pool.length<POOL(k)){const t=step(1+(rnd()*20|0),rnd,OPS[rnd()*4|0]);if(t)pool.push(t);}
    for(let i=pool.length-1;i>0;i--){const j=rnd()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]];}   // 並びを混ぜる(固定)
    return{s,target:v,L,pool:pool.map((t,i)=>({...t,id:i,used:false}))};
  }
}
function build(k){
  const g=gen(k),nodes=[];
  for(let i=0;i<=g.L;i++){const v=i%2,u=i;nodes.push({rx:(v-.5)*2+(u-g.L/2)*.2,ry:-(u-g.L/2)*.8+(v-.5)*.2});}
  S={k,...g,nodes,slots:Array(g.L).fill(null),hover:-1,run:false,shown:g.s,hero:{rx:nodes[0].rx,ry:nodes[0].ry}};
  sel=null;fit();hud();tiles();
  log(`ステージ${k}：スタート${g.s}から計算して、ゴールの${g.target}にしよう。下のレールを指でスライドして、道の上で離すと敷けるよ。`);
}
function resize(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);if(S)fit();}
function fit(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const n of S.nodes){x0=Math.min(x0,n.rx);x1=Math.max(x1,n.rx);y0=Math.min(y0,n.ry);y1=Math.max(y1,n.ry);}
  const sc=Math.min((W-100)/((x1-x0)||1),(H-115)/((y1-y0)||1));
  view={sc,ox:W/2-(x0+x1)/2*sc,oy:H/2-(y0+y1)/2*sc+16};
}
const P=(rx,ry)=>({x:view.ox+rx*view.sc,y:view.oy+ry*view.sc}),NP=i=>P(S.nodes[i].rx,S.nodes[i].ry);
function values(){const v=[S.s];for(let i=0;i<S.L;i++){const t=S.slots[i];v.push(t&&v[i]!==null?apply(v[i],t):null);}return v;}

/* ===== イラスト ===== */
const R=(c,a,b,w,h)=>{cx.fillStyle=c;cx.fillRect(a,b,w,h);};
const Tri=(c,a,b,c2,d,e,f)=>{cx.fillStyle=c;cx.beginPath();cx.moveTo(a,b);cx.lineTo(c2,d);cx.lineTo(e,f);cx.closePath();cx.fill();};
const C=(c,a,b,r,r2)=>{cx.fillStyle=c;cx.beginPath();cx.ellipse(a,b,r,r2||r,0,0,7);cx.fill();};
function ill(type,x,y,s){
  cx.save();cx.translate(x,y);cx.scale(s/20,s/20);
  if(type==='boss'){Tri('#3b0d4f',-21,0,0,-34,21,0);C('#7b2d8e',0,-24,12);Tri('#f2e8d0',-10,-30,-14,-43,-4,-33);Tri('#f2e8d0',10,-30,14,-43,4,-33);C('#ff3030',-5,-25,2.6);C('#ff3030',5,-25,2.6);R('#111',-5,-19,10,3);Tri('#fff',-4,-19,-1,-19,-2.5,-15);Tri('#fff',1,-19,4,-19,2.5,-15);}
  else{R('#8a8f9c',-13,-12,26,12);R('#222',-4,-8,8,8);R('#654',-1,-38,2,28);Tri('#2d7be0',1,-38,18,-32,1,-26);}
  cx.restore();
}
function hero(x,y,bob){
  cx.save();cx.translate(x,y-bob);cx.scale(1.25,1.25);
  C('#0005',0,bob/1.25+2,8,3);R('#2f6fd6',-6,-14,12,12);R('#7a4a22',-6,-5,12,2);C('#ffd9b0',0,-20,7);
  cx.fillStyle='#aeb7c8';cx.beginPath();cx.arc(0,-21,7.5,Math.PI,0);cx.fill();Tri('#d22',0,-28,9,-31,3,-23);
  C('#111',-2.5,-19,1);C('#111',2.5,-19,1);R('#dfe6f2',8,-25,2,15);R('#caa24a',6,-11,6,2);
  cx.restore();
}
function scenery(t){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd0f2');g.addColorStop(.26,'#d4f0fb');g.addColorStop(.26,'#62ad5c');g.addColorStop(1,'#2e6b40');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='#7fb27a';cx.beginPath();cx.ellipse(W*.25,H*.26,W*.35,H*.07,0,Math.PI,0);cx.fill();cx.beginPath();cx.ellipse(W*.8,H*.26,W*.3,H*.05,0,Math.PI,0);cx.fill();
  cx.fillStyle='#fffc';for(let i=0;i<3;i++){const x=((t/60+i*W/2.5)%(W+120))-60,y=18+i*22;cx.beginPath();cx.ellipse(x,y,34,10,0,0,7);cx.ellipse(x+18,y-6,20,9,0,0,7);cx.fill();}
  for(let i=0;i<12;i++){const x=(i%2?.06+((i*37)%7)/100:.94-((i*53)%7)/100)*W,y=H*(.34+((i*29)%58)/100),s=9+i%3*3;R('#6b4423',x-2,y,4,s);C('#1f7a3a',x,y-s*.4,s,s*1.1);C('#2f9a4c',x-2,y-s*.7,s*.6,s*.7);}
}
function label(s,x,y,sz,col){cx.font=`bold ${sz}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=4;cx.strokeStyle='#000c';cx.lineJoin='round';cx.strokeText(s,x,y);cx.fillStyle=col;cx.fillText(s,x,y);}
function plank(a,b,t,pw,time){
  const [top,side]=OPCOL[t.op],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),nx=-dy/L*pw,ny=dx/L*pw;
  const poly=o=>{cx.beginPath();cx.moveTo(a.x+nx,a.y+ny+o);cx.lineTo(b.x+nx,b.y+ny+o);cx.lineTo(b.x-nx,b.y-ny+o);cx.lineTo(a.x-nx,a.y-ny+o);cx.closePath();};
  cx.save();poly(7);cx.fillStyle=side;cx.fill();poly(0);cx.fillStyle=top;cx.fill();cx.lineWidth=1;cx.strokeStyle='#0008';cx.stroke();
  cx.strokeStyle='#fff6';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(a.x+nx*.6,a.y+ny*.6);cx.lineTo(b.x+nx*.6,b.y+ny*.6);cx.stroke();cx.restore();
  label(t.op+t.n,(a.x+b.x)/2,(a.y+b.y)/2,17,'#fff');
}
function draw(time){
  scenery(time);
  const pw=Math.max(9,Math.min(15,view.sc*.11)),nr=Math.max(15,Math.min(22,view.sc*.17)),vals=values();
  for(let i=0;i<S.L;i++){const a=NP(i),b=NP(i+1);
    if(S.hover===i){cx.save();cx.strokeStyle='#fff';cx.globalAlpha=.6;cx.lineWidth=pw*2+16;cx.lineCap='round';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();cx.restore();}
    if(S.slots[i])plank(a,b,S.slots[i],pw,time);
    else{cx.setLineDash([7,7]);cx.strokeStyle='#ffffffa0';cx.lineWidth=3;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();cx.setLineDash([]);label('?',(a.x+b.x)/2,(a.y+b.y)/2,16,'#fff');}}
  for(let i=0;i<=S.L;i++){
    const p=NP(i),last=i===S.L,s=last?nr*1.2:nr;
    C('#0005',p.x,p.y+3,s*1.1,s*.5);C('#8c93a8',p.x,p.y,s*1.05,s*.5);C('#aab1c6',p.x,p.y-2,s*1.05,s*.5);
    if(i===0)ill('start',p.x,p.y,s);
    if(last){ill('boss',p.x,p.y,s);label('ゴール '+S.target,p.x,p.y-s*2.3,15,'#ffb0b0');}
    else if(i===0)label('スタート '+S.s,p.x,p.y-s*2.2,15,'#9fd4ff');
    else label(vals[i]===null?'?':String(vals[i]),p.x,p.y-s*.2,17,vals[i]===null?'#555':'#fff');
  }
  const h=P(S.hero.rx,S.hero.ry);hero(h.x,h.y-2,S.run?Math.abs(Math.sin(time/110))*6:Math.sin(time/400)*1.5);
  if(S.run)label(String(S.shown),h.x,h.y-52,20,'#ffe27a');
}
function loop(t){if(S)draw(t);requestAnimationFrame(loop);}

/* ===== UI ===== */
function hud(){const v=values();const end=v[S.L];$('hud').innerHTML=`<span>ステージ${S.k}</span><span>🚩 ${S.s}</span><span>🎯 ${S.target}</span><span>${end===null?'結果 ?':'結果 '+end}</span>`;}
function log(m){$('log').textContent=m;}
function tiles(){
  $('rails').innerHTML='';
  for(const t of S.pool)if(!t.used){const b=document.createElement('button');b.className='t';b.textContent=t.op+t.n;b.style.background=`linear-gradient(${OPCOL[t.op][0]},${OPCOL[t.op][1]})`;
    b.addEventListener('pointerdown',ev=>{if(!S.run)begin(t,null,ev);});$('rails').appendChild(b);}
}
function overlay(text,btns){
  $('ovt').textContent=text;$('ovb').innerHTML='';
  for(const [l,fn] of btns){const b=document.createElement('button');b.textContent=l;b.onclick=()=>{$('ov').classList.remove('show');fn();};$('ovb').appendChild(b);}
  $('ov').classList.add('show');
}
const distSeg=(px,py,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((px-a.x)*dx+(py-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a.x-dx*t,py-a.y-dy*t);};
/* ===== ドラッグ＆ドロップ(レールをスライドして道の上で離す) ===== */
let drag=null;
function pickSlot(x,y){let best=-1,bs=1e9;for(let i=0;i<S.L;i++){const a=NP(i),b=NP(i+1),d=distSeg(x,y,a,b);if(d>36)continue;const sc=d+.25*Math.hypot(x-(a.x+b.x)/2,y-(a.y+b.y)/2);if(sc<bs){bs=sc;best=i;}}return best;}
const begin=(tile,from,ev)=>{drag={tile,from,sx:ev.clientX,sy:ev.clientY,started:false,ghost:null};};
const gpos=ev=>({x:ev.clientX,y:ev.clientY-44});   // 指の少し上にレールを表示
cv.addEventListener('pointerdown',ev=>{
  if(!S||S.run)return;const rc=cv.getBoundingClientRect(),i=pickSlot(ev.clientX-rc.left,ev.clientY-rc.top);
  if(i>=0&&S.slots[i])begin(S.slots[i],i,ev);
});
addEventListener('pointermove',ev=>{
  if(!drag)return;
  if(!drag.started){
    if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<8)return;
    drag.started=true;if(drag.from!==null)S.slots[drag.from]=null;drag.tile.used=true;
    const g=document.createElement('div');g.className='ghost';g.textContent=drag.tile.op+drag.tile.n;g.style.background=`linear-gradient(${OPCOL[drag.tile.op][0]},${OPCOL[drag.tile.op][1]})`;
    document.body.appendChild(g);drag.ghost=g;tiles();hud();
  }
  const p=gpos(ev),rc=cv.getBoundingClientRect();drag.ghost.style.left=p.x+'px';drag.ghost.style.top=p.y+'px';
  S.hover=pickSlot(p.x-rc.left,p.y-rc.top);
});
function endDrag(ev,cancel){
  if(!drag)return;const d=drag;drag=null;S.hover=-1;if(d.ghost)d.ghost.remove();
  if(!d.started){
    if(!cancel&&d.from!==null){d.tile.used=false;S.slots[d.from]=null;log('レールを外した。');}
    else if(!cancel)log('レールを指でスライドして、道の上で離してね。');
    tiles();hud();return;
  }
  const p=gpos(ev),rc=cv.getBoundingClientRect(),i=cancel?-1:pickSlot(p.x-rc.left,p.y-rc.top);
  if(i>=0){const old=S.slots[i];if(old)old.used=false;S.slots[i]=d.tile;log(`${d.tile.op}${d.tile.n} を敷いた。`);}
  else{d.tile.used=false;log('道の上で離すと敷けます。');}
  tiles();hud();
}
addEventListener('pointerup',ev=>endDrag(ev,false));addEventListener('pointercancel',ev=>endDrag(ev,true));

/* ===== 自動進行 ===== */
const tween=(a,b,ms=800)=>new Promise(res=>{const A=S.nodes[a],B=S.nodes[b],t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);S.hero.rx=A.rx+(B.rx-A.rx)*k;S.hero.ry=A.ry+(B.ry-A.ry)*k;k<1?requestAnimationFrame(f):res();})(t0);});
function reset(){S.run=false;S.shown=S.s;S.hero.rx=S.nodes[0].rx;S.hero.ry=S.nodes[0].ry;busy(false);hud();}
async function go(){
  if(S.run)return;reset();S.run=true;busy(true);let v=S.s;
  for(let i=0;i<S.L;i++){
    const t=S.slots[i];
    if(!t)return fail('レールがつながっていません。全部のマスにレールを敷こう。');
    await tween(i,i+1);const nv=apply(v,t);
    if(nv===null)return fail(`${v} ÷ ${t.n} は割り切れません…`);
    log(`${v} ${t.op} ${t.n} = ${nv}`);v=nv;S.shown=v;await sleep(750);
  }
  if(v!==S.target)return fail(`ゴールの数字と違う…\n${v} ≠ ${S.target}`);
  S.run=false;busy(false);
  overlay(S.k>=10?'🎉 全ステージクリア！':`🎉 ステージ${S.k}クリア！\n${S.target}ぴったり`,S.k>=10?[['最初から',()=>{$('stg').value=1;build(1);}]]:[['次のステージへ',()=>{$('stg').value=S.k+1;build(S.k+1);}]]);
}
function fail(msg){S.run=false;busy(false);log(msg.replace('\n',' '));overlay('残念…\n'+msg,[['配置を直す',reset],['最初から',()=>build(S.k)]]);}
function busy(b){for(const el of document.querySelectorAll('#ui button,#ui select'))el.disabled=b;}

for(let k=1;k<=10;k++){const o=document.createElement('option');o.value=k;o.textContent=`ステージ${k}`;$('stg').appendChild(o);}
$('stg').onchange=()=>build(+$('stg').value);$('go').onclick=go;$('clr').onclick=()=>{if(!S.run)build(S.k);};
addEventListener('resize',resize);resize();build(1);requestAnimationFrame(loop);
</script>
</body></html>
